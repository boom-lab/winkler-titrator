[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "winkler-titrator"
description = "Automated Winkler titration system for dissolved oxygen analysis"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Dan Nicholson", email = "dnicholson@uvic.ca"}
]
maintainers = [
    {name = "Dan Nicholson", email = "dnicholson@uvic.ca"}
]
keywords = ["oceanography", "dissolved oxygen", "winkler titration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dynamic = ["version"]
dependencies = [
    "PyQt6>=6.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pyserial>=3.5",
    "gsw>=3.6",
    "tinydb>=4.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.0",
    "flake8>=6.0",
]

[project.urls]
Homepage = "https://github.com/dnicholson/winkler-titrator"
Repository = "https://github.com/dnicholson/winkler-titrator.git"
Documentation = "https://github.com/dnicholson/winkler-titrator#readme"

[project.scripts]
winkler = "winkler.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools_scm]
write_to = "src/winkler/_version.py"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3 